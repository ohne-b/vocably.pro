<form class="card-form" (submit)="save.emit(this.model)">
  <div class="field-row">
    <div class="field grow">
      <label class="field-label" [htmlFor]="'source_' + item.id">{{
        'decks.card_form.source' | transloco
      }}</label>
      <input
        type="text"
        class="form-control"
        [id]="'source_' + item.id"
        name="source"
        [(ngModel)]="model.source"
      />
    </div>

    <div class="field">
      <label class="field-label" [htmlFor]="'partOfSpeech_' + item.id">{{
        'decks.card_form.part_of_speech' | transloco
      }}</label>
      <input
        type="text"
        class="form-control"
        [id]="'partOfSpeech_' + item.id"
        name="partOfSpeech"
        [(ngModel)]="model.partOfSpeech"
      />
    </div>
  </div>

  <div class="field">
    <label class="field-label" [htmlFor]="'translation_' + item.id">{{
      'decks.card_form.translation' | transloco
    }}</label>
    <input
      type="text"
      class="form-control"
      [id]="'translation_' + item.id"
      name="translation"
      [(ngModel)]="model.translation"
    />
  </div>

  <div class="field">
    <label class="field-label" [htmlFor]="'definition_' + item.id">{{
      'decks.card_form.definition' | transloco
    }}</label>
    <textarea
      class="form-control"
      [id]="'definition_' + item.id"
      name="definition"
      [(ngModel)]="model.definition"
      rows="3"
    ></textarea>
  </div>

  <div class="field">
    <label class="field-label" [htmlFor]="'example_' + item.id">{{
      'decks.card_form.examples' | transloco
    }}</label>
    <textarea
      class="form-control"
      [id]="'example_' + item.id"
      name="example"
      [(ngModel)]="model.example"
      rows="3"
    ></textarea>
  </div>

  <div class="form-actions">
    <button
      data-test="cancel"
      type="button"
      class="cancel"
      (click)="cancel.emit()"
    >
      {{ 'decks.card_form.cancel' | transloco }}
    </button>
    <button data-test="submit" type="submit" class="button">
      {{ 'decks.card_form.save' | transloco }}
    </button>
  </div>
</form>
