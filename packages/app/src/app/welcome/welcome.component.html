<div
  class="top"
  [class.container]="size === 'normal'"
  [class.container-l]="size === 'large'"
>
  <app-header></app-header>
</div>
<div
  class="bottom"
  [class.container]="size === 'normal'"
  [class.container-l]="size === 'large'"
>
  <div class="hero">
    <div
      class="install"
      *ngIf="extensionCanBeInstalled && extensionIsInstalled === false"
    >
      <div class="install-icon" aria-hidden="true">
        <mat-icon>extension</mat-icon>
      </div>
      <h1 class="install-title">
        {{ 'welcome.install_title' | transloco }}
      </h1>
      <p class="install-lead">
        {{ 'welcome.install_lead' | transloco }}
      </p>

      <div class="install-actions">
        <a
          *ngFor="let option of installOptions"
          class="install-extension-button with-icon"
          [attr.data-browser]="option.browser"
          [href]="option.url"
          target="_blank"
        >
          <img
            class="install-extension-button-icon"
            [src]="option.icon"
            alt=""
          />
          {{ 'welcome.add_to' | transloco: { browser: option.browser } }}
        </a>
        <a
          *ngIf="installOptions.length === 0"
          class="install-extension-button"
          [href]="extensionInstallUrl"
          target="_blank"
        >
          {{ 'welcome.install_extension' | transloco }}
        </a>
      </div>

      <p class="install-note">
        {{ 'welcome.install_note' | transloco }}
      </p>
    </div>
    <router-outlet *ngIf="extensionIsInstalled === true"></router-outlet>
  </div>
</div>
